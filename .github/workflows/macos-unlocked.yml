# Personal macOS build of Readest (universal: Apple Silicon + Intel) with the
# third-party cloud-sync paywall (WebDAV / S3 / Google Drive / OneDrive /
# iCloud) unlocked for local use.
#
# Mirrors android-unlocked.yml:
#   1. Polls upstream readest/readest for its latest release tag (daily cron,
#      or on demand via Run workflow).
#   2. Skips everything when that exact tag was already built (marker cached
#      by tag), so a new DMG appears only when upstream ships a new release.
#   3. Checks out UPSTREAM code at that tag — this fork does NOT need to stay
#      synced — then re-applies the one-line unlock patch:
#        CLOUD_SYNC_REQUIRES_PREMIUM = true -> false
#      in apps/readest-app/src/utils/access.ts. A grep right after fails fast
#      if a future upstream rename breaks the patch.
#   4. Builds an unsigned universal DMG (aarch64 + x86_64 in one bundle).
#      No APPLE_* secrets are configured, so Gatekeeper blocks the first
#      open — run `xattr -cr /Applications/Readest.app` once, or right-click
#      -> Open twice.
#   5. Publishes the DMG to this fork's Releases under the rolling tag
#      `unlocked-macos` (one stable download URL, updated on every build).
#
# No repository secrets are required: the committed .env carries working
# defaults, and the Sentry source-map upload no-ops without SENTRY_AUTH_TOKEN.

name: macOS Unlocked

on:
  schedule:
    - cron: '43 22 * * *' # daily, off the hour to dodge runner rush
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream tag was already built
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-unlocked
  cancel-in-progress: false

env:
  UPSTREAM_REPO: readest/readest
  BUILT_STATE_DIR: .unlocked-built-state

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: resolve latest upstream release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -er '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::could not resolve the latest release tag of ${UPSTREAM_REPO}"
            exit 1
          fi
          echo "Latest upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: macos-latest # arm64 runner; universal build covers x86_64 too
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      # Marker cache keyed by the resolved tag: a hit means we already built
      # and published this exact upstream release; the post-job save only
      # stores it once this job succeeds with a fresh build.
      - name: restore built-tag marker
        id: state
        if: ${{ inputs.force != true }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILT_STATE_DIR }}
          key: unlocked-built-macos-${{ needs.resolve.outputs.tag }}

      - name: decide whether to build
        id: decide
        run: |
          if [ "${{ steps.state.outputs.cache-hit }}" = "true" ]; then
            echo "Upstream tag ${{ needs.resolve.outputs.tag }} was already built — nothing to do."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          else
            echo "Building upstream tag ${{ needs.resolve.outputs.tag }}."
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: checkout upstream at the resolved tag
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: setup pnpm
        if: steps.decide.outputs.should_build == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        if: steps.decide.outputs.should_build == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        if: steps.decide.outputs.should_build == 'true'
        run: pnpm --filter @readest/readest-app setup-vendors

      # Both slices of the universal binary need their rust stdlib.
      - name: install rust stable (universal darwin targets)
        if: steps.decide.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: rust cache
        if: steps.decide.outputs.should_build == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: macos-unlocked-cargo

      - name: create .env.local for Next.js
        if: steps.decide.outputs.should_build == 'true'
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/readest-app/.env.local

      # Deliberately NOT layering src-tauri/tauri.macos-nonestore.conf.json
      # like upstream: that overlay embeds Readest's Developer ID provisioning
      # profile + entitlements, which is useless (and inert) for an unsigned
      # personal build. Plain universal DMG instead — no APPLE_* env needed.
      - name: apply unlock patch and build universal dmg
        if: steps.decide.outputs.should_build == 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"

          # ─── unlock patch: flip the cloud-sync paywall off ───
          sed -i '' \
            's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' \
            apps/readest-app/src/utils/access.ts
          grep -q 'export const CLOUD_SYNC_REQUIRES_PREMIUM = false;' apps/readest-app/src/utils/access.ts || {
            echo '::error::unlock patch did not apply — upstream changed src/utils/access.ts; update the sed pattern in this workflow'
            exit 1
          }
          echo "Unlock patch applied: CLOUD_SYNC_REQUIRES_PREMIUM -> false"

          # This personal build has no signing key. Disable updater artifact
          # generation so tauri doesn't require TAURI_SIGNING_PRIVATE_KEY.
          node -e "const fs=require('fs'); const p='apps/readest-app/src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.bundle.createUpdaterArtifacts=false; fs.writeFileSync(p, JSON.stringify(c, null, 2)+'\n')"

          cd apps/readest-app/
          pnpm tauri build --target universal-apple-darwin

          # Cargo WORKSPACE: bundles land in the REPO-ROOT target/ dir, not
          # apps/readest-app/src-tauri/target/.
          dmg=$(ls ../../target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)
          cp "$dmg" "../../Readest_${version}_unlocked_macos_universal.dmg"
          ls -lh "../../Readest_${version}_unlocked_macos_universal.dmg"

          mkdir -p "../../${BUILT_STATE_DIR}"
          echo "$version" > "../../${BUILT_STATE_DIR}/built-tag.txt"

      - name: upload dmg artifact
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Readest-${{ needs.resolve.outputs.tag }}-unlocked-macos
          path: Readest_${{ needs.resolve.outputs.tag }}_unlocked_macos_universal.dmg
          if-no-files-found: error

      # Publish to THIS fork's Releases under one rolling tag so there is
      # always a single stable download URL with the latest unlocked DMG.
      - name: publish dmg to release
        if: steps.decide.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: unlocked-macos
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"
          dmg="Readest_${version}_unlocked_macos_universal.dmg"
          title="Readest ${version} — macOS universal (WebDAV/S3 unlocked)"
          notes="Unlocked third-party cloud sync (WebDAV / S3 / Drive / OneDrive / iCloud). Built from upstream ${UPSTREAM_REPO}@${version}."
          notes="${notes}"$'\n\n'"- Universal DMG (Apple Silicon + Intel), UNSIGNED. First open blocked by Gatekeeper: run \`xattr -cr /Applications/Readest.app\` once, or right-click -> Open -> Open."
          notes="${notes}"$'\n\n'"Personal AGPL build — not an official Readest release."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "$title" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$dmg" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes"
          fi

      - name: write job summary
        if: steps.decide.outputs.should_build == 'true'
        run: |
          version="${{ needs.resolve.outputs.tag }}"
          {
            echo "## Readest ${version} — macOS unlocked build"
            echo ''
            echo "- Patch applied: \`CLOUD_SYNC_REQUIRES_PREMIUM = false\` (WebDAV / S3 / Drive / OneDrive / iCloud sync unlocked)"
            echo "- DMG: \`Readest_${version}_unlocked_macos_universal.dmg\` (universal: Apple Silicon + Intel, unsigned)"
            echo '- First open: `xattr -cr /Applications/Readest.app` or right-click -> Open twice.'
            echo "- Published to: https://github.com/${GITHUB_REPOSITORY}/releases/tag/unlocked-macos"
          } >> "$GITHUB_STEP_SUMMARY"
