# Personal iOS build of Readest (unsigned arm64 IPA for sideloading) with the
# third-party cloud-sync paywall (WebDAV / S3 / Google Drive / OneDrive /
# iCloud) unlocked for local use.
#
# Mirrors android-unlocked.yml:
#   1. Polls upstream readest/readest for its latest release tag (daily cron,
#      or on demand via Run workflow).
#   2. Skips everything when that exact tag was already built (marker cached
#      by tag), so a new IPA appears only when upstream ships a new release.
#   3. Checks out UPSTREAM code at that tag — this fork does NOT need to stay
#      synced — then applies two patches:
#        a. CLOUD_SYNC_REQUIRES_PREMIUM = true -> false in
#           apps/readest-app/src/utils/access.ts (the same one-line unlock as
#           the other workflows), verified with a grep.
#        b. Builds with `tauri ios build --no-sign`, which passes
#           CODE_SIGNING_ALLOWED=NO / CODE_SIGN_IDENTITY="" to xcodebuild and
#           packages the unsigned IPA itself from the .xcarchive — no Apple
#           Developer account needed.
#      Unlike Android, gen/apple is NOT regenerated from scratch: upstream's
#      committed Xcode project carries their ShareExtension/Widget targets,
#      which `tauri ios init` would wipe.
#   4. If the tauri-managed packaging still fails for any reason, the step
#      tolerates a non-zero exit and packages the unsigned IPA itself from
#      the .xcarchive (Payload zip). It fails hard if no archive was
#      produced at all.
#   5. Publishes the IPA to this fork's Releases under the rolling tag
#      `unlocked-ios` (one stable download URL, updated on every build).
#
# Install: sideload the unsigned IPA with AltStore / Sideloadly / TrollStore,
# or re-sign it with your own Apple ID first.
#
# No repository secrets are required: the committed .env carries working
# defaults, and the Sentry source-map upload no-ops without SENTRY_AUTH_TOKEN.

name: iOS Unlocked

on:
  schedule:
    - cron: '11 22 * * *' # daily, off the hour to dodge runner rush
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream tag was already built
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-unlocked
  cancel-in-progress: false

env:
  UPSTREAM_REPO: readest/readest
  BUILT_STATE_DIR: .unlocked-built-state

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: resolve latest upstream release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -er '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::could not resolve the latest release tag of ${UPSTREAM_REPO}"
            exit 1
          fi
          echo "Latest upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 150 # xcodebuild + SPM resolution are slow; be generous
    permissions:
      contents: write
    steps:
      # Marker cache keyed by the resolved tag: a hit means we already built
      # and published this exact upstream release; the post-job save only
      # stores it once this job succeeds with a fresh build.
      - name: restore built-tag marker
        id: state
        if: ${{ inputs.force != true }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BUILT_STATE_DIR }}
          key: unlocked-built-ios-${{ needs.resolve.outputs.tag }}

      - name: decide whether to build
        id: decide
        run: |
          if [ "${{ steps.state.outputs.cache-hit }}" = "true" ]; then
            echo "Upstream tag ${{ needs.resolve.outputs.tag }} was already built — nothing to do."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          else
            echo "Building upstream tag ${{ needs.resolve.outputs.tag }}."
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: checkout upstream at the resolved tag
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: setup pnpm
        if: steps.decide.outputs.should_build == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        if: steps.decide.outputs.should_build == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        if: steps.decide.outputs.should_build == 'true'
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install rust stable (ios arm64 target)
        if: steps.decide.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios

      - name: rust cache
        if: steps.decide.outputs.should_build == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ios-unlocked-cargo

      - name: create .env.local for Next.js
        if: steps.decide.outputs.should_build == 'true'
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: apply unlock patch, disable signing, build ipa
        if: steps.decide.outputs.should_build == 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"
          cd apps/readest-app/

          # ─── unlock patch: flip the cloud-sync paywall off ───
          sed -i '' \
            's/export const CLOUD_SYNC_REQUIRES_PREMIUM = true;/export const CLOUD_SYNC_REQUIRES_PREMIUM = false;/' \
            src/utils/access.ts
          grep -q 'export const CLOUD_SYNC_REQUIRES_PREMIUM = false;' src/utils/access.ts || {
            echo '::error::unlock patch did not apply — upstream changed src/utils/access.ts; update the sed pattern in this workflow'
            exit 1
          }
          echo "Unlock patch applied: CLOUD_SYNC_REQUIRES_PREMIUM -> false"

          # ─── build unsigned: tauri's --no-sign passes CODE_SIGNING_ALLOWED=NO
          # and CODE_SIGN_IDENTITY="" to xcodebuild, then packages the
          # unsigned IPA itself from the xcarchive (gen/apple/build/<arch>/).
          # NOTE: patching project.yml is pointless here — `tauri ios build`
          # does NOT re-run xcodegen; it uses the committed .pbxproj as-is.
          rm -rf src-tauri/gen/apple/build
          pnpm tauri ios build --target aarch64 --no-sign || \
            echo "::warning::tauri ios build exited non-zero — packaging the archive manually"

          out_ipa="Readest_${version}_unlocked_ios_arm64.ipa"
          ipa=$(find src-tauri/gen/apple/build -type f -name '*.ipa' 2>/dev/null | head -n1)
          if [ -n "${ipa:-}" ]; then
            echo "Using exported IPA: ${ipa}"
            cp "$ipa" "$out_ipa"
          else
            archive=$(find src-tauri/gen/apple/build -type d -name '*.xcarchive' 2>/dev/null | head -n1)
            [ -n "${archive:-}" ] || {
              echo '::error::no .ipa or .xcarchive found under gen/apple/build — the iOS build failed before archiving'
              exit 1
            }
            app="${archive}/Products/Applications/Readest.app"
            [ -d "$app" ] || { echo "::error::Readest.app not found inside ${archive}"; exit 1; }
            rm -rf Payload
            mkdir Payload
            cp -R "$app" Payload/
            zip -qry "$out_ipa" Payload
            rm -rf Payload
            echo "Packaged unsigned IPA from archive: ${archive}"
          fi
          ls -lh "$out_ipa"

          mkdir -p "../../${BUILT_STATE_DIR}"
          echo "$version" > "../../${BUILT_STATE_DIR}/built-tag.txt"

      - name: upload ipa artifact
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Readest-${{ needs.resolve.outputs.tag }}-unlocked-ios
          path: apps/readest-app/Readest_${{ needs.resolve.outputs.tag }}_unlocked_ios_arm64.ipa
          if-no-files-found: error

      # Publish to THIS fork's Releases under one rolling tag so there is
      # always a single stable download URL with the latest unlocked IPA.
      - name: publish ipa to release
        if: steps.decide.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: unlocked-ios
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.tag }}"
          ipa="apps/readest-app/Readest_${version}_unlocked_ios_arm64.ipa"
          title="Readest ${version} — iOS arm64 unsigned (WebDAV/S3 unlocked)"
          notes="Unlocked third-party cloud sync (WebDAV / S3 / Drive / OneDrive / iCloud). Built from upstream ${UPSTREAM_REPO}@${version}."
          notes="${notes}"$'\n\n'"- Unsigned arm64 IPA. Sideload with AltStore / Sideloadly / TrollStore, or re-sign with your own Apple ID."
          notes="${notes}"$'\n\n'"Personal AGPL build — not an official Readest release."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ipa" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "$title" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes"
          fi

      - name: write job summary
        if: steps.decide.outputs.should_build == 'true'
        run: |
          version="${{ needs.resolve.outputs.tag }}"
          {
            echo "## Readest ${version} — iOS unlocked build"
            echo ''
            echo "- Patch applied: \`CLOUD_SYNC_REQUIRES_PREMIUM = false\` (WebDAV / S3 / Drive / OneDrive / iCloud sync unlocked)"
            echo "- IPA: \`Readest_${version}_unlocked_ios_arm64.ipa\` (arm64 device, unsigned)"
            echo '- Install: sideload via AltStore / Sideloadly / TrollStore, or sign with your own Apple ID.'
            echo "- Published to: https://github.com/${GITHUB_REPOSITORY}/releases/tag/unlocked-ios"
          } >> "$GITHUB_STEP_SUMMARY"
